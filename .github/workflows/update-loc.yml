
name: Refresh Neofetch Profile

on:
  schedule:
    - cron: "0 0 * * *" # Every day at 00:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Decide whether to recalculate code frequency
        id: schedule
        run: |
          # Full Git-history calculation every Monday
          # Manual trigger always recalculates.
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_frequency=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_frequency=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.schedule.outputs.run_frequency == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calculate Git code frequency across public repositories
        if: steps.schedule.outputs.run_frequency == 'true'
        env:
          GH_USERNAME: rootagi
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXCLUDE_REPOS: walls,wallpaper
          INCLUDE_FORKS: "true"
        run: python scripts/calculate-code-frequency.py

      - name: Bump README cache-buster
        run: |
          RUN_TAG="${{ github.run_id }}-${{ github.run_attempt }}"
          sed -i -E "s/v=[0-9a-zA-Z_-]+/v=$RUN_TAG/g" README.md
          echo "DATE_TAG=$(date -u +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md neofetch.json

          git diff --staged --quiet || (
            git commit -m "chore: refresh profile stats [$DATE_TAG]"
            git push
          )
